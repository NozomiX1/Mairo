<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Super Mario JS — 网页版马里奥</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #101418;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    overflow: hidden;
    touch-action: manipulation;
  }
  #wrap {
    position: relative;
    line-height: 0;
  }
  canvas#game {
    width: min(90vw, calc(90vh * 256 / 240), 768px);
    height: auto;
    aspect-ratio: 256 / 240;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 4px solid #2a2f36;
    border-radius: 4px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
    background: #5c94fc;
  }
  #hint {
    color: #6b7683;
    font-size: 12px;
    margin-top: 10px;
    letter-spacing: 1px;
    user-select: none;
  }
  /* 触屏虚拟按键（仅触摸设备显示） */
  #touch {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 12px;
    padding: 0 18px;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 10;
    pointer-events: none;
  }
  #touch .group { display: flex; gap: 12px; pointer-events: auto; }
  #touch button {
    width: 62px; height: 62px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: 22px;
    font-family: inherit;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #touch button:active { background: rgba(255,255,255,.3); }
  @media (pointer: coarse) {
    #touch { display: flex; }
    #hint { display: none; }
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="256" height="240"></canvas>
  </div>
  <div id="hint">← → 移动 · Z / 空格 跳跃 · X 加速 · ↓ 蹲下 · P 暂停 · M 静音</div>
  <div id="touch">
    <div class="group">
      <button id="btn-left">◀</button>
      <button id="btn-right">▶</button>
    </div>
    <div class="group">
      <button id="btn-run">B</button>
      <button id="btn-jump">A</button>
    </div>
  </div>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/level.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
