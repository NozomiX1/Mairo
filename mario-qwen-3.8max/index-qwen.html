    -webkit-user-select:none;touch-action:none;}

// ============ 输入 ============
const keys = {};
let jumpBuf = 0, firePressed = false, enterPressed = false, paused = false, muted = false;
function kd(code){ return !!keys[code]; }
addEventListener('keydown', e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  keys[e.code] = true;
  ensureAudio();
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space') jumpBuf = 0.12;
  if(e.code==='KeyX'||e.code==='KeyK') firePressed = true;
  if(e.code==='Enter') enterPressed = true;
  if(e.code==='KeyM') muted = !muted;
  if(e.code==='KeyP' && state==='playing') paused = !paused;
});
addEventListener('keyup', e=>{ keys[e.code] = false; });
addEventListener('blur', ()=>{ if(state==='playing') paused = true; });

// 触屏按钮
function bindTouch(id, code){
  const el = document.getElementById(id);
  const on = e=>{ e.preventDefault(); ensureAudio(); keys[code]=true;
    if(code==='Jump'){ jumpBuf=0.12; } if(code==='Fire'){ firePressed=true; }
    if(code==='Ent'){ enterPressed=true; } };
  const off = e=>{ e.preventDefault(); keys[code]=false; };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
}
bindTouch('tb-l','ArrowLeft'); bindTouch('tb-r','ArrowRight');
bindTouch('tb-a','Jump'); bindTouch('tb-b','Fire');
cv.addEventListener('pointerdown', ()=>{ ensureAudio(); if(state!=='playing') enterPressed=true; });

// ============ 音效（WebAudio 合成，原创音色） ============
let AC=null, master=null, noiseBuf=null;
function ensureAudio(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate*0.3, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }catch(e){}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||muted) return;
  type=type||'square'; vol=(vol===undefined)?0.16:vol; delay=delay||0;
  const t0=AC.currentTime+delay;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type;
  o.frequency.setValueAtTime(Math.max(1,f0),t0);
  o.frequency.linearRampToValueAtTime(Math.max(1,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0+dur+0.02);
}
function noise(dur,vol,delay){
  if(!AC||muted) return;
  const t0=AC.currentTime+(delay||0);
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=noiseBuf;
  g.gain.setValueAtTime(vol||0.12,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+(dur||0.12));
  s.connect(g); g.connect(master);
  s.start(t0); s.stop(t0+(dur||0.12)+0.02);
}
function sfx(n){
  if(!AC||muted) return;
  switch(n){
    case 'jump':   tone(320,660,0.16,'square',0.14); break;
    case 'coin':   tone(988,988,0.06,'square',0.13); tone(1319,1319,0.28,'square',0.13,0.06); break;
    case 'stomp':  tone(420,110,0.1,'triangle',0.2); noise(0.05,0.06); break;
    case 'bump':   tone(190,95,0.08,'square',0.18); break;
    case 'break':  noise(0.18,0.2); tone(240,70,0.14,'square',0.12); break;
    case 'power':  [523,659,784,1047,1319].forEach((f,i)=>tone(f,f,0.09,'square',0.13,i*0.07)); break;
    case 'grow':   [392,494,587,784,988].forEach((f,i)=>tone(f,f,0.09,'square',0.13,i*0.06)); break;
    case 'shrink': [784,587,494,392].forEach((f,i)=>tone(f,f,0.09,'square',0.13,i*0.06)); break;
    case 'die':    [660,622,587,494,392,330,262].forEach((f,i)=>tone(f,f,0.12,'triangle',0.16,i*0.11)); break;
    case 'fire':   tone(920,220,0.08,'square',0.12); break;
    case 'kick':   tone(500,180,0.08,'square',0.16); noise(0.04,0.08); break;
    case '1up':    [659,784,1319,1047,1175,1568].forEach((f,i)=>tone(f,f,0.09,'square',0.14,i*0.08)); break;
    case 'flag':   tone(392,784,0.25,'square',0.12);
                   [784,988,1175,1568].forEach((f,i)=>tone(f,f,0.12,'square',0.12,0.22+i*0.11)); break;
    case 'clear':  [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,f,0.11,'square',0.13,i*0.1)); break;
  }
}

// ============ 像素画 ============
const PAL = {
  R:'#e52521', S:'#ffa044', H:'#6b3800', B:'#2b3cf2', Y:'#ffd800', K:'#4a2a00',
  W:'#ffffff', E:'#141414', G:'#12a01a', g:'#8ce13c', n:'#b06a20', m:'#5f3410',
  N:'#ffe0b8', O:'#ff7020', D:'#c77800', t:'#12a01a', q:'#fce4a8'
};
function mk(rows, over){
  const w = Math.max.apply(null, rows.map(r=>r.length));
  const c = document.createElement('canvas'); c.width=w; c.height=rows.length;
  const g2 = c.getContext('2d');
  for(let y=0;y<rows.length;y++) for(let x=0;x<rows[y].length;x++){
    const ch=rows[y][x]; if(ch==='.') continue;
    let col = (over&&over[ch]) ? over[ch] : PAL[ch];
    if(!col) continue;
    g2.fillStyle=col; g2.fillRect(x,y,1,1);
  }
  return c;
}

  fn(c.getContext('2d')); return c; }

// ============ 关卡构建 ============
let map, spawns, flagX, castleX, decor;

  map = Array.from({length:ROWS}, ()=> new Array(COLS).fill(' '));
  spawns = [];

  const flat=(x0,x1)=>{ for(let x=x0;x<=x1;x++){ set(x,13,'X'); set(x,14,'X'); } };
  const pipe=(x,h)=>{ for(let i=0;i<h;i++){ const y=12-i;
    set(x,y,i===h-1?'(':'['); set(x+1,y,i===h-1?')':']'); } };
  const stairsUp=(x,n)=>{ for(let i=0;i<n;i++) for(let y=12-i;y<=12;y++) set(x+i,y,'#'); };
  const stairsDown=(x,n)=>{ for(let i=0;i<n;i++) for(let y=12-(n-1-i);y<=12;y++) set(x+i,y,'#'); };

  flat(0,68); flat(71,85); flat(89,152); flat(155,211);

  set(flagX,12,'#');

  // 敌人出生点（t: g=板栗怪, k=龟壳怪）
  [[24,'g'],[26,'g'],[34,'k'],[40,'g'],[42,'g'],[50,'g'],[52,'g'],
   [80,'g'],[82,'g'],[97,'k'],[105,'g'],[107,'g'],[125,'g'],[127,'g'],
   [131,'k'],[138,'g'],[145,'g'],[158,'g'],[160,'g'],[164,'g'],[167,'k']
  ].forEach(([x,t])=> spawns.push({t, x:x*TILE+2}));

  // 装饰（灌木 / 山丘 / 云）
  decor = {
    bushes:[2,11,23,41,59,71,83,95,111,124,141,158,176],
    hills:[0,16,48,64,96,112,144,168],
    clouds:[3,9,19,26,36,45,56,66,76,88,99,109,121,133,145,157,171,185,199,208]
  };
}

// ============ 实体状态 ============
let player, enemies, powerups, fireballs, particles, popups, coinPops, bumps;
let score, coins, lives, timer, state, freeze, camX, deathT, flagAnim, mode, shellComboT, timeBonus, bonusT;

function resetPlayer(){
  player = {
    x: 40, y: 13*TILE-14, w:12, h:14, vx:0, vy:0,
    dir:1, power:0,
    onGround:false, inv:0, step:0, dead:false
  };
}
function newGame(){
  score=0; coins=0; lives=3; loadLevel(); state='playing'; paused=false;
}
function loadLevel(){
  buildLevel();
  enemies=[]; powerups=[]; fireballs=[]; particles=[]; popups=[]; coinPops=[]; bumps={};
  timer=300; camX=0; freeze=0; flagAnim=null; mode='play'; timeBonus=0; bonusT=0;
  jumpBuf=0;
  resetPlayer();
  spawnEnemies();
}
function spawnEnemies(){
  spawns.forEach(s=>{
    if(s.t==='g') enemies.push({type:'goomba', x:s.x, y:13*TILE-12, w:14, h:12, vx:-22, vy:0, alive:true, squash:-1, step:Math.random()*10});
    else enemies.push({type:'koopa', x:s.x, y:13*TILE-20, w:12, h:20, vx:-28, vy:0, alive:true, step:0});
  });
}
function makeShell(x,y,vx){
  return {type:'shell', x, y, w:14, h:12, vx, vy:0, alive:true, grace:0};
}

// ============ 物理 & 碰撞 ============
function solidAt(cx,cy){
  if(cx<0||cx>=COLS) return true;
  if(cy<0||cy>=ROWS) return false;
  return SOLID.has(map[cy][cx]);
}
function moveX(e,dt){
  e.hitX=false;
  e.x += e.vx*dt;
  const cy0=Math.floor(e.y/TILE), cy1=Math.floor((e.y+e.h-1)/TILE);
  if(e.vx>0){
    const tx=Math.floor((e.x+e.w)/TILE);
    for(let cy=cy0;cy<=cy1;cy++) if(solidAt(tx,cy)){ e.x=tx*TILE-e.w-0.01; e.hitX=true; break; }
  }else if(e.vx<0){
    const tx=Math.floor(e.x/TILE);
    for(let cy=cy0;cy<=cy1;cy++) if(solidAt(tx,cy)){ e.x=(tx+1)*TILE+0.01; e.hitX=true; break; }
  }
}
function moveY(e,dt,solidCeil){
  e.onGround=false; e.hitHead=null;
  e.y += e.vy*dt;
  const cx0=Math.floor(e.x/TILE), cx1=Math.floor((e.x+e.w-1)/TILE);
  if(e.vy>0){
    const ty=Math.floor((e.y+e.h)/TILE);
    for(let cx=cx0;cx<=cx1;cx++) if(solidAt(cx,ty)){ e.y=ty*TILE-e.h; e.vy=0; e.onGround=true; break; }
  }else if(e.vy<0 && solidCeil!==false){
    const ty=Math.floor(e.y/TILE);
    const ax0=Math.floor((e.x+2)/TILE), ax1=Math.floor((e.x+e.w-3)/TILE);
    let best=1e9, hit=-1; const mid=e.x+e.w/2;
    for(let cx=Math.min(ax0,cx0);cx<=Math.max(ax1,cx1);cx++)
      if(solidAt(cx,ty)){ const d=Math.abs(cx*TILE+8-mid); if(d<best){best=d;hit=cx;} }
    if(hit>=0){ e.y=(ty+1)*TILE+0.01; e.vy=0; e.hitHead={cx:hit, cy:ty}; }
  }
}
function overlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// ============ 顶砖逻辑 ============
function bumpTile(cx,cy){
  const c = map[cy][cx];
  if(c==='B'){
    if(player.power>=1){
      map[cy][cx]=' ';
      score+=50; sfx('break');
      for(let i=0;i<4;i++) particles.push({x:cx*16+4+(i%2)*8, y:cy*16+4, vx:(i%2?70:-70),
        vy:(i<2?-260:-160), t:0, life:1.4, kind:'brick'});
    }else{ bumpAnim(cx,cy); sfx('bump'); }
  }else if(c==='?'){
    map[cy][cx]='U'; bumpAnim(cx,cy); sfx('coin');
    coins++; addCoinPopup(cx,cy); score+=200;
  }else if(c==='M'){
    map[cy][cx]='U'; bumpAnim(cx,cy); sfx('power');
    spawnPowerup(cx,cy);
  }else{
    bumpAnim(cx,cy); sfx('bump');
  }
  // 顶砖消灭站在砖上的敌人
  enemies.forEach(e=>{
    if(!e.alive || e.type==='shell') return;
    if(Math.abs((e.y+e.h)-cy*16)<5 && e.x+e.w>cx*16 && e.x<cx*16+16){
      flipKill(e,100);
    }
  });
}
function bumpAnim(cx,cy){ bumps[cx+','+cy]=0.28; }
function addCoinPopup(cx,cy){
  coinPops.push({x:cx*16+8, y:cy*16-6, vy:-260, t:0});
}
function spawnPowerup(cx,cy){
  const kind = (player.power>=1) ? 'flower' : 'mush';
  powerups.push({kind, x:cx*16+2, y:cy*16, w:12, h:13, rise:0, vx:0, vy:0,
    src:{cx,cy}, alive:true});
}

// ============ 玩家更新 ============
function setPlayerSize(power){
  const newH = (power>=1)?27:14;
  player.y += player.h - newH;
  player.h = newH;
}
function hurt(){
  if(player.inv>0 || mode!=='play') return;
  if(player.power>=2){ player.power=1; setPlayerSize(1); player.inv=2; sfx('shrink'); freeze=0.5; }
  else if(player.power===1){ player.power=0; setPlayerSize(0); player.inv=2; sfx('shrink'); freeze=0.5; }
  else die();
}
function die(){
  if(mode!=='play') return;
  mode='dying'; deathT=0; player.vy=-300; player.dead=true; sfx('die');
}
function updatePlayer(dt){
  const p=player;
  if(mode==='dying'){
    deathT+=dt; p.vy+=G_DOWN*dt; p.y+=p.vy*dt;
    if(deathT>2.2){
      lives--;
      if(lives<=0){ state='gameover'; }
      else { loadLevel(); }
    }
    return;
  }
  const left = kd('ArrowLeft')||kd('KeyA');
  const right = kd('ArrowRight')||kd('KeyD');
  const run = kd('ShiftLeft')||kd('ShiftRight');
  const jumpHold = kd('ArrowUp')||kd('KeyW')||kd('Space')||kd('Jump');
  const max = run?RUN:WALK;

  if(mode==='flag'){
    // 滑旗杆
    p.vx=0; p.vy=120; moveY(p,dt,false);
    flagSlide(dt);
    if(p.y >= 12*TILE-p.h){ p.y=12*TILE-p.h; mode='flagwalk'; }
    updateCamera(dt); return;
  }
  if(mode==='flagwalk'){
    // 脚本化走向城堡（沿地面直行，忽略地形阻挡，还原原版过场）
    p.vx=RUN*0.8; p.dir=1;
    p.x += p.vx*dt;
    p.y = 13*TILE - p.h;
    p.step += p.vx*dt;
    if(p.x > castleX*16+56){
      mode='win'; state='win';
      bonusT=Math.ceil(timer); timeBonus=0; sfx('clear');
    }
    updateCamera(dt); return;
  }

  // 水平移动
  let acc = p.onGround ? ACCEL : AIR_ACCEL;
  if(run) acc *= 1.1;
  if(left && !right){
    if(p.vx>0 && p.onGround){ p.vx -= SKID*dt; } else p.vx = Math.max(p.vx-acc*dt, -max);
    if(p.vx<=0) p.dir=-1;
  }else if(right && !left){
    if(p.vx<0 && p.onGround){ p.vx += SKID*dt; } else p.vx = Math.min(p.vx+acc*dt, max);
    if(p.vx>=0) p.dir=1;
  }else{
    const dec = p.onGround?DECEL:60;
    if(p.vx>0) p.vx=Math.max(0,p.vx-dec*dt); else p.vx=Math.min(0,p.vx+dec*dt);
  }

  // 跳跃
  jumpBuf -= dt;
  if(jumpBuf>0 && p.onGround){
    p.vy=-JUMP_V; p.onGround=false; jumpBuf=0; sfx('jump');
  }
  if(p.vy<0 && !jumpHold) p.vy += G_UP_REL*dt;
  else if(p.vy<0) p.vy += G_UP_HELD*dt;
  else p.vy += G_DOWN*dt;
  p.vy = Math.min(p.vy, MAX_FALL);

  const prevY=p.y;
  moveX(p,dt);
  if(p.x<camX+1){ p.x=camX+1; p.vx=Math.max(0,p.vx); }
  if(p.x>COLS*TILE-p.w-2) p.x=COLS*TILE-p.w-2;
  moveY(p,dt);

  // 顶砖
  if(p.hitHead) bumpTile(p.hitHead.cx, p.hitHead.cy);

  // 吃金币砖块地图上的悬浮金币
  const cx0=Math.floor(p.x/TILE), cx1=Math.floor((p.x+p.w)/TILE);
  const cy0=Math.floor(p.y/TILE), cy1=Math.floor((p.y+p.h)/TILE);
  for(let cy=Math.max(0,cy0);cy<=Math.min(ROWS-1,cy1);cy++)
    for(let cx=Math.max(0,cx0);cx<=Math.min(COLS-1,cx1);cx++)
      if(map[cy][cx]==='c'){
        map[cy][cx]=' '; coins++; score+=200; sfx('coin');
      }
  if(coins>=100){ coins-=100; lives++; sfx('1up'); popup(p.x,p.y-12,'1UP'); }

  // 无敌 / 动画
  if(p.inv>0) p.inv-=dt;
  if(Math.abs(p.vx)>8 && p.onGround) p.step += Math.abs(p.vx)*dt;

  // 火球
  if(firePressed){
    firePressed=false;
    if(p.power===2 && fireballs.filter(f=>f.alive).length<2){
      fireballs.push({x:p.x+(p.dir>0?p.w:-6), y:p.y+(p.h>20?10:4), w:6, h:6,
        vx:p.dir*180, vy:-30, alive:true});
      sfx('fire');
    }
  }

  // 掉坑
  if(p.y > ROWS*TILE+8) die();

  // 旗杆触发
  const poleX = flagX*TILE+7;
  if(mode==='play' && p.x+p.w > flagX*TILE-1 && p.x < flagX*TILE+24){
    mode='flag'; p.x=poleX-p.w-1; p.vy=0;
    const heightBonus = Math.max(1, Math.min(8, Math.round((12*TILE-p.y)/16)));
    score += heightBonus*100;
    flagAnim = {y:2*TILE+6, t:0};
    sfx('flag');
  }

  collideEnemies(prevY);
  updateCamera(dt);
}
function updateCamera(dt){
  const target = player.x - 132;
  camX = Math.max(camX, Math.min(target, COLS*TILE-VIEW_W));
  camX = Math.max(0, camX);
}
function flagSlide(dt){
  if(!flagAnim) return;
  flagAnim.t+=dt;
  flagAnim.y = Math.min(flagAnim.y+120*dt, 12*TILE-18);
}

// ============ 敌人 ============
function flipKill(e,pts){
  e.alive=false; e.flip=true; e.vy=-180; e.vx=(Math.random()<0.5?-40:40);
  e.y-=1; score+=pts; popup(e.x+e.w/2,e.y,''+pts); sfx('stomp');
}
function popup(x,y,text){ popups.push({x,y,text,t:0}); }
function collideEnemies(prevY){
  const p=player;
  enemies.forEach(e=>{
    if(!e.alive && !e.flip) return;
    if(e.flip || !overlap(p,e)) return;
    if(e.type==='shell' && e.vx===0){ // 踢静止龟壳
      if(overlap(p,e)){ kickShell(e); return; }
    }
    const pBottomPrev = prevY + p.h;
    if(p.vy>0 && pBottomPrev <= e.y+7){
      // 踩中
      if(e.type==='goomba' || e.type==='koopa'){
        if(e.type==='goomba'){ e.alive=false; e.squash=0.5; sfx('stomp'); score+=100; popup(e.x+e.w/2,e.y,'100'); }
        else { // 龟变壳
          const sh=makeShell(e.x, e.y+e.h-12, 0);
          Object.assign(e,{type:'shell', w:14, h:12, vx:0, vy:0, grace:0, y:sh.y});
          sfx('stomp'); score+=100; popup(e.x+e.w/2,e.y,'100');
        }
        p.vy=-180; p.y = e.y - p.h;
      }else if(e.type==='shell'){
        if(e.vx!==0){ e.vx=0; score+=100; popup(e.x+e.w/2,e.y,'100'); sfx('stomp'); p.vy=-180; p.y=e.y-p.h; }
        else { kickShell(e); p.vy=-140; }
      }
    }else{
      // 侧面碰到
      if(e.type==='shell' && e.vx===0){ kickShell(e); }
      else if(e.type==='shell' && e.grace>0){ /* 刚踢出去不伤自己 */ }
      else hurt();
    }
  });
}
function kickShell(e){
  const dir = (player.x+player.w/2) < (e.x+e.w/2) ? 1 : -1;
  e.vx = dir*150; e.grace=0.3; sfx('kick'); score+=400; popup(e.x+e.w/2,e.y,'400');
}
function updateEnemies(dt){
  enemies.forEach(e=>{
    if(e.x > camX+VIEW_W+96 || e.x < camX-64){ if(!e.flip) return; }
    if(e.flip){
      e.vy+=G_DOWN*dt; e.x+=e.vx*dt; e.y+=e.vy*dt;
      return;
    }
    if(e.type==='goomba' && !e.alive){
      if(e.squash>0){ e.squash-=dt; }
      return;
    }
    if(!e.alive) return;
    e.vy = Math.min(e.vy+G_DOWN*dt, MAX_FALL);
    moveX(e,dt);
    if(e.hitX){
      if(e.type==='shell' && e.vx!==0){ e.vx=-e.vx; sfx('bump'); }
      else e.vx=-e.vx;
    }
    moveY(e,dt);
    if(e.type==='shell') e.grace=Math.max(0,e.grace-dt);
    if(e.type==='goomba') e.step+=dt*6;
    if(e.type==='shell' && Math.abs(e.vx)>10){
      // 龟壳撞敌人
      enemies.forEach(o=>{
        if(o!==e && o.alive && !o.flip && o.type!=='shell' && overlap(e,o)){
          flipKill(o,200);
        }
      });
    }
    if(e.y>ROWS*TILE+40) e.alive=false;
  });
  enemies = enemies.filter(e=> (e.alive||e.flip||e.squash>0) && e.y<ROWS*TILE+90);
}

// ============ 道具 ============
function updatePowerups(dt){
  powerups.forEach(u=>{
    if(!u.alive) return;
    if(u.rise<1){
      u.rise=Math.min(1,u.rise+dt/0.7);
      u.y = u.src.cy*16 - u.h*u.rise;
      return;
    }
    if(u.kind==='mush'){
      if(u.dir===undefined) u.dir=1;
      u.vx=u.dir*45;
      u.vy=Math.min(u.vy+G_DOWN*dt,MAX_FALL);
      moveX(u,dt); if(u.hitX) u.dir=-u.dir;
      moveY(u,dt);
      if(u.y>ROWS*TILE+40) u.alive=false;
    }
    if(overlap(player,u) && mode==='play'){
      u.alive=false; score+=1000; popup(u.x,u.y,'1000'); sfx('grow');
      if(player.power===0){ player.power=1; setPlayerSize(1); freeze=0.8; }
      else if(player.power===1){ player.power=2; freeze=0.8; }
    }
  });
  powerups=powerups.filter(u=>u.alive);
}
function updateFireballs(dt){
  fireballs.forEach(f=>{
    if(!f.alive) return;
    f.vy=Math.min(f.vy+800*dt,300);
    moveX(f,dt);
    if(f.hitX){ explode(f.x+3,f.y+3); f.alive=false; return; }
    moveY(f,dt);
    if(f.onGround) f.vy=-160;
    if(f.y>ROWS*TILE+20 || f.x<camX-20 || f.x>camX+VIEW_W+20){ f.alive=false; return; }
    enemies.forEach(e=>{
      if(e.alive && !e.flip && overlap(f,e)){
        flipKill(e,200); f.alive=false;
      }
    });
  });
  fireballs=fireballs.filter(f=>f.alive);
}
function explode(x,y){
  for(let i=0;i<5;i++) particles.push({x,y,vx:(Math.random()*2-1)*120,
    vy:(Math.random()*2-1)*120,t:0,life:0.3,kind:'spark'});
}

// ============ 粒子 / 弹出物 ============
function updateParticles(dt){
  particles.forEach(p=>{ p.t+=dt; p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; });
  particles=particles.filter(p=>p.t<p.life);
  popups.forEach(p=>{ p.t+=dt; p.y-=22*dt; });
  popups=popups.filter(p=>p.t<0.9);
  coinPops.forEach(c=>{ c.t+=dt; c.vy+=1500*dt; c.y+=c.vy*dt; });
  coinPops=coinPops.filter(c=>c.t<0.5);
  for(const k in bumps){ bumps[k]-=dt; if(bumps[k]<=0) delete bumps[k]; }
}

// ============ 主步进 ============
function step(dt){
  if(state==='title'){ if(enterPressed){ enterPressed=false; newGame(); } return; }
  if(state==='gameover'){ if(enterPressed){ enterPressed=false; state='title'; } return; }
  if(state==='win'){
    if(bonusT>0){ bonusT--; timeBonus+=10; score+=10; }
    if(enterPressed){ enterPressed=false; state='title'; }
    return;
  }
  if(state!=='playing' || paused) return;
  if(freeze>0){ freeze-=dt; return; }
  updatePlayer(dt);
  if(mode==='play'||mode==='flag'||mode==='flagwalk'){
    updateEnemies(dt); updatePowerups(dt); updateFireballs(dt);
  }
  updateParticles(dt);
  if(mode==='play'){
    timer -= dt*2.5;
    if(timer<=0){ timer=0; die(); }
  }
}

// ============ 渲染 ============
function drawSprite(img,x,y,flip){
  x=Math.round(x); y=Math.round(y);
  if(flip){
    ctx.save(); ctx.translate(x+img.width,y); ctx.scale(-1,1);
    ctx.drawImage(img,0,0); ctx.restore();
  }else ctx.drawImage(img,x,y);
}
function drawBG(){
  ctx.fillStyle='#5c94fc'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  if(!decor) return;
  const ox=-camX;
  // 云
  ctx.fillStyle='#ffffff';
  decor.clouds.forEach((cx,i)=>{
    const x=cx*16+ox, y=(i%2?28:44)+ (i%3)*6;
    if(x<-60||x>VIEW_W+20) return;
    ctx.beginPath();
    ctx.arc(x,y,8,0,7); ctx.arc(x+10,y-4,9,0,7); ctx.arc(x+22,y,8,0,7);
    ctx.fill();
  });
  // 山丘
  decor.hills.forEach((hx,i)=>{
    const x=hx*16+ox, w=(i%2?90:60), h=(i%2?34:24);
    if(x<-w||x>VIEW_W+20) return;
    ctx.fillStyle='#1e9e1e';
    ctx.beginPath(); ctx.moveTo(x,13*16);
    ctx.lineTo(x+w/2,13*16-h); ctx.lineTo(x+w,13*16); ctx.fill();
    ctx.fillStyle='#0c6e0c';
    ctx.beginPath(); ctx.moveTo(x+w*0.3,13*16-h*0.45);
    ctx.lineTo(x+w/2,13*16-h); ctx.lineTo(x+w*0.7,13*16-h*0.45); ctx.fill();
  });
  // 灌木
  ctx.fillStyle='#8ce13c';
  decor.bushes.forEach(bx=>{
    const x=bx*16+ox;
    if(x<-60||x>VIEW_W+20) return;
    ctx.beginPath();
    ctx.arc(x,13*16-4,7,Math.PI,0);
    ctx.arc(x+9,13*16-6,9,Math.PI,0);
    ctx.arc(x+18,13*16-4,7,Math.PI,0);
    ctx.fill();
  });
}
function drawTiles(){
  const ox=-camX;
  const c0=Math.max(0,Math.floor(camX/TILE)-1), c1=Math.min(COLS-1,c0+27);
  for(let cy=0;cy<ROWS;cy++) for(let cx=c0;cx<=c1;cx++){
    const ch=map[cy][cx];
    if(ch===' '||ch==='c') continue;
    const key=cx+','+cy;
    const off = bumps[key] ? Math.sin((0.28-bumps[key])/0.28*Math.PI)*5 : 0;
    const img = ch==='M' ? C_Q : TILE_IMG[ch];
    if(img) ctx.drawImage(img, cx*TILE+ox, cy*TILE-off);
  }
  // 悬浮金币
  const f=Math.floor(performance.now()/120)%3;
  const imgs=[COIN_1,COIN_2,COIN_3];
  for(let cy=0;cy<ROWS;cy++) for(let cx=c0;cx<=c1;cx++){
    if(map[cy][cx]==='c'){
      drawSprite(imgs[f], cx*TILE+ox, cy*TILE+2);
    }
  }
}
function drawFlagCastle(){
  const ox=-camX;
  // 城堡
  const bx=castleX*16+ox;
  if(bx>-160 && bx<VIEW_W+20){
    ctx.fillStyle='#b0b0b0';
    ctx.fillRect(bx,13*16-64,80,64);
    ctx.fillRect(bx+16,13*16-96,48,32);
    ctx.fillStyle='#787878';
    for(let i=0;i<5;i++) ctx.fillRect(bx+i*16+4,13*16-72,8,8);
    for(let i=0;i<3;i++) ctx.fillRect(bx+16+i*16,13*16-104,8,8);
    ctx.fillStyle='#141414';
    ctx.fillRect(bx+32,13*16-32,16,32); // 门
    ctx.fillRect(bx+24,13*16-88,8,8);  // 窗
    ctx.fillRect(bx+48,13*16-88,8,8);
  }
  // 旗杆
  const px=flagX*TILE+7+ox;
  if(px>-20 && px<VIEW_W+20){
    ctx.fillStyle='#3cbcfc'; ctx.fillRect(px,2*16,2,10*16);
    ctx.fillStyle='#1e9e1e'; ctx.fillRect(px-8,2*16-6,10,8);
    // 旗
    const fy = flagAnim?flagAnim.y:2*TILE+6;
    ctx.fillStyle='#e52521';
    ctx.beginPath();
    ctx.moveTo(px,Math.min(fy,12*16-18)); ctx.lineTo(px-12,Math.min(fy,12*16-18)+5);
    ctx.lineTo(px,Math.min(fy,12*16-18)+10); ctx.fill();
  }
}
function drawPlayer(){
  const p=player;
  if(mode==='dying'){
    drawSprite(M_SMALL_A, p.x-2-camX, p.y, false);
    return;
  }
  if(p.inv>0 && Math.floor(p.inv*30)%2===0) return;
  let img;
  const walking = Math.abs(p.vx)>8;
  const frame = walking ? (Math.floor(p.step/9)%2) : 0;
  if(freeze>0){ // 变大闪烁
    img = (Math.floor(performance.now()/80)%2===0) ? M_SMALL_A : (p.power===2?M_FIRE_A:M_BIG_A);
    const oy = img.height===16 ? p.y+(p.h-16) : p.y+(p.h-img.height);
    drawSprite(img, p.x-2-camX, oy, p.dir<0);
    return;
  }
  if(p.power===0) img = frame?M_SMALL_B:M_SMALL_A;
  else if(p.power===1) img = frame?M_BIG_B:M_BIG_A;
  else img = frame?M_FIRE_B:M_FIRE_A;
  drawSprite(img, p.x-2-camX, p.y+(p.h-img.height), p.dir<0);
}
function drawEnemies(){
  enemies.forEach(e=>{
    const x=e.x-camX;
    if(x<-32||x>VIEW_W+32) return;
    if(e.type==='goomba'){
      if(!e.alive){ if(e.squash>0) drawSprite(GOOMBA_A, x-1, e.y+e.h-9, false); return; }
      drawSprite(Math.floor(e.step)%2?GOOMBA_B:GOOMBA_A, x-1, e.y, e.vx>0);
    }else if(e.type==='koopa'){
      drawSprite(KOOPA, x-2, e.y+2, e.vx>0);
    }else if(e.type==='shell'){
      drawSprite(SHELL, x-1, e.y+2, e.vx>0);
    }
  });
}
function drawPowerups(){
  powerups.forEach(u=>{
    const x=u.x-camX;
    if(u.kind==='mush') drawSprite(MUSHROOM, x-2, u.y, false);
    else drawSprite(FLOWER, x-2, u.y-2, false);
    if(u.rise<1){ // 用砖块遮挡正在钻出的道具（还原原版“钻出”效果）
      ctx.drawImage(C_U, u.src.cx*16-camX, u.src.cy*16);
    }
  });
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.fillStyle = p.kind==='brick' ? '#cf7a2b' : '#ffd800';
    if(p.kind==='brick'){
      ctx.save(); ctx.translate(p.x-camX,p.y); ctx.rotate(p.t*10);
      ctx.fillRect(-3,-3,6,6); ctx.restore();
    }else ctx.fillRect(p.x-camX-1,p.y-1,3,3);
  });
  coinPops.forEach(c=>{
    const f=Math.floor(c.t*12)%3;
    drawSprite([COIN_1,COIN_2,COIN_3][f], c.x-8-camX, c.y);
  });
  ctx.font='bold 7px monospace'; ctx.fillStyle='#ffffff';
  popups.forEach(p=> ctx.fillText(p.text, p.x-camX-6, p.y));
  fireballs.forEach(f=>{
    if(!f.alive) return;
    ctx.fillStyle='#ff7020';
    ctx.beginPath(); ctx.arc(f.x+3-camX, f.y+3, 3, 0, 7); ctx.fill();
    ctx.fillStyle='#ffd800';
    ctx.fillRect(f.x+2-camX, f.y+2, 2, 2);
  });
}
function hud(){
  ctx.font='bold 8px monospace'; ctx.fillStyle='#ffffff';
  const pad=(n,l)=>('000000'+n).slice(-l);
  ctx.fillText('MARIO', 16, 10);
  ctx.fillText(pad(score,6), 16, 20);
  drawSprite(COIN_1, 108, 11);
  ctx.fillText('x'+pad(coins,2), 124, 20);
  ctx.fillText('WORLD', 172, 10);
  ctx.fillText(' 1-1', 172, 20);
  ctx.fillText('TIME', 236, 10);
  ctx.fillText(' '+pad(Math.ceil(timer),3), 236, 20);
  ctx.fillText('LIVES', 308, 10);
  ctx.fillText(' x'+lives, 308, 20);
}
function centerText(text,y,size,color){
  ctx.font='bold '+(size||8)+'px monospace';
  ctx.fillStyle=color||'#ffffff';
  const w=ctx.measureText(text).width;
  ctx.fillText(text,(VIEW_W-w)/2,y);
}
function render(){
  drawBG();
  if(state==='title'){
    ctx.fillStyle='#5c94fc'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
    // 标题屏背景
    ctx.fillStyle='#1e9e1e'; ctx.fillRect(0,200,VIEW_W,40);
    ctx.fillStyle='#b13425'; ctx.fillRect(70,52,260,66);
    ctx.fillStyle='#fce4a8'; ctx.fillRect(74,56,252,58);
    ctx.font='bold 26px monospace'; ctx.fillStyle='#b13425';
    ctx.fillText('SUPER PLUMBER', 96, 92);
    ctx.font='bold 10px monospace'; ctx.fillStyle='#6b3800';
    ctx.fillText('WEB EDITION - MARIO STYLE', 112, 108);
    drawSprite(M_SMALL_A, 120, 140, false);
    drawSprite(GOOMBA_A, 200, 142, false);
    drawSprite(MUSHROOM, 250, 142, false);
    if(Math.floor(performance.now()/500)%2===0)
      centerText('PRESS ENTER / CLICK TO START', 176, 9, '#ffd800');
    centerText('ARROWS/WASD MOVE   SPACE JUMP   SHIFT RUN   X FIRE', 224, 7, '#141414');
    return;
  }
  drawFlagCastle();
  drawTiles();
  drawPowerups();
  drawEnemies();
  drawPlayer();
  drawParticles();
  hud();
  if(paused && state==='playing'){
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
    centerText('PAUSED', 116, 14, '#ffd800');
    centerText('PRESS P TO RESUME', 136, 8);
  }
  if(state==='gameover'){
    ctx.fillStyle='#000'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
    centerText('GAME OVER', 112, 16, '#ffffff');
    centerText('SCORE '+score, 136, 8);
    if(Math.floor(performance.now()/500)%2===0)
      centerText('PRESS ENTER', 168, 8, '#ffd800');
  }
  if(state==='win'){
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
    centerText('COURSE CLEAR!', 96, 16, '#ffd800');
    centerText('TIME BONUS  '+timeBonus, 124, 9);
    centerText('SCORE  '+score, 140, 9);
    if(bonusT<=0 && Math.floor(performance.now()/500)%2===0)
      centerText('PRESS ENTER TO TITLE', 176, 8, '#ffd800');
  }
}

// ============ 状态机 ============
state='title';
buildLevel(); // 预构建关卡数据，保证标题屏渲染不崩溃
camX = 0;

// ============ 主循环 ============
let last=0, acc=0;
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000||0.016); last=t;
  acc+=dt;
  while(acc>1/60){ step(1/60); acc-=1/60; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
