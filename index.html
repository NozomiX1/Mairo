<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超级马里奥 · Web版</title>
<style>
  html,body{margin:0;height:100%;background:#0f0f18;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  #wrap{display:flex;flex-direction:column;align-items:center;gap:12px;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 50px rgba(0,0,0,.7);border:3px solid #2a2a3a;border-radius:4px;}
  #hint{color:#8b8ba0;font-size:12px;text-align:center;line-height:1.7;user-select:none;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="256" height="240"></canvas>
  <div id="hint">移动 ←→ / A D　·　跳跃 ↑ / W / 空格（按住跳更高）<br>加速跑 Shift　·　火球 X / F　·　暂停 P　·　静音 M</div>
</div>
<script src="game.js"></script>
</body>
</html>
