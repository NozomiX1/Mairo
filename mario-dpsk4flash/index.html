<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Mario Bros. — Web 版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="game" width="256" height="240"></canvas>
  </div>
  <div id="touch">
    <div id="touch-left">
      <button class="tbtn" id="btn-left">◀</button>
      <button class="tbtn" id="btn-right">▶</button>
    </div>
    <div id="touch-right">
      <button class="tbtn" id="btn-run">B</button>
      <button class="tbtn" id="btn-jump">A</button>
    </div>
  </div>
</div>
<script src="js/font.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/level.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
</body>
</html>
